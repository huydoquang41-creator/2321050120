<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        .khung{
            width: 50%;
            height: 50px;
            /* background-color: aqua; */
            margin: auto;
            margin: auto;
            text-align: center;
            font-size: 20px;
            color: blue;
        }
        main{
            width: 31%;
            height: 600px;
            background-color: #ddd;
            margin: auto;
            border-radius: 10px ;
        }
        .title{
            text-align: center;
            width: 100%;
            height: 100px;
        }
        h2{
            font-size: 30px;
        }
        .ten{
            width: 100%;
            height: 100px;
            /* background-color: antiquewhite; */
            display: flex;
            justify-content: space-between;
            border-top:2px solid #ccc ;
            border-bottom:2px solid #ccc ;
            align-items: center;
        }
        .tendem{
            width: 47%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
            
        }
        .hvt{
            width: 47%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button{
            width: 100%;
            height: 50px;
            /* background-color: white; */
            border-radius: 10px;
        }
        .noidung{
            width: 100%;
            height: 30px;
            /* background-color: aqua; */
            margin-top: 5px;
        }
        .ntn{
            width: 100%;
            height: 50px;
            /* background-color: bisque; */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ngay{
            width: 31%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .thang{
            width: 31%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .nam{
            width: 31%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .gt{
            width: 100%;
            height: 50px;
            /* background-color: bisque; */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nu{
             width: 31%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .nam{
            width: 31%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .custom{
             width: 31%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .sdt{
            width: 99%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .pass{
            width: 99%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .sign{
            width: 50%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: green;
            color: white;
            font-size: 30px;
        }
        .lapacc{
            width: 50%;
            height: 50px;
            margin-top: 10px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        a{
            color: blue;
            font-size: 20px;
        }
        .text{
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="khung">
                <div class="logo">
                    <h1>
                        faceboook
                    </h1>
                </div>
        </div>
    </header>
    <main>
        <div class="title">
            <h2>Create a new account</h2>
            <p>It's quick and easy</p>
        </div>
        <div class="ten">
            <div class="tendem">
                <button>
                    <p>First name</p>
                </button>
            </div>
            <div class="hvt">
                <button>
                    Surname
                </button>
            </div>
        </div>
        <div class="nsinh">
            <div class="noidung">Date of birth ?</div>
            <div class="ntn">
                <div class="ngay">
                    <button type="count">
                        15
                    </button>
                </div>
                <div class="thang">
                    <button>Sep</button>
                </div>
                <div class="nam">
                    <button>2025</button>
                </div>
            </div>
        </div>
        <div class="gioitinh">
            <div class="noidung">Gender ?</div>
            <div class="gender">
                <div class="gt">
                    <div class="nu">
                        <button type="radio" name="gender" value="Female">
                            Female
                        </button>
                    </div>
                    <div class="nam">
                        <button type="radio" name="gender" value="Female">
                            Male
                        </button>
                    </div>
                    <div class="custom">
                        <button type="radio" name="gender" value="Female">
                            Custom
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="sdt">
            <div class="text">Mobile number or email address</div>
        </div>
        <div class="pass">
            <div class="text">New password</div>
        </div>
        
        <div class="sign">
            <div class="text"><b>Sign up</b></div>
        </div>
        <div class="lapacc">
            <div class="text">
                <a>Already have an account?</a>
            </div>
        </div>
    </main>
</body>
</html>
