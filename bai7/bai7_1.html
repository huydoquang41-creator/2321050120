<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            width: 100%;
            height: 700px;
            background-color: #ccc;
        }
        .khung{
            width: 80%;
            height: 700px;
            background-color: white;
            margin: auto;
            display: flex;
        }
        .khung-trai{
            width: 50%;
            height: 700px;
        }
        .khung-phai{
            width: 50%;
            height: 700px;
        }
        .phai{
            width: 80%;
            height: 700px;
            margin: auto;
        }
        .login{
            width: 100%;
            height: 100px;
            font-size: 30px;
        }
        .dangnhap{
            width: 100%;
            height: 20px;
            border-bottom: 2px solid black;
            margin-bottom: 20px;
        }
        .password{
            width: 100%;
            height: 20px;
            border-bottom: 2px solid black;
            margin-bottom: 20px;
        }
        .nho{
            width: 50%;
            height: 20px;
            margin-bottom: 20px;
        }
        .sign{
            width: 100%;
            height: 50px;
        }
        .signup{
            width: 30%;
            height: 50px;
            background-color: skyblue;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .text{
            color: white;
        }
        .mxh{
            display: flex;
            width: 100%;
            height: 20px;
            margin-top: 100px;
        }
        .fb{ 
            width: 10%;
            height:35px ;
            background-color: blue;
            margin: 0 10px 0 10px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sky{
            width: 10%;
            height:35px ;
            background-color: skyblue;
            margin: 0 10px 0 10px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .google{
            width: 10%;
            height:35px ;
            background-color: red;
            margin: 0 10px 0 10px;
            border-radius: 5px; 
            display: flex;
            justify-content: center;
            align-items: center;   
        }
    </style>
</head>
<body>
    <div class="khung">
        <div class="khung-trai">
            <div class="trai">
                <img src="../fpt/img/640x396-muado.jpg" width="80%" height="500px">
                <a href="#">Creat an account</a>
            </div>
        </div>
        <div class="khung-phai">
            <div class="phai"> 
                <div class="login">
                    <b>Log In</b>
                </div>
                <div class="dangnhap">
                    Ten dang nhap
                </div>
                <div class="password">
                    Mat khau cua ban
                </div>
                <div class="nho">
                    Remember me
                </div>
                <div class="sign">
                    <div class="signup">
                        <div class="text"><b>Log in</b></div> 
                    </div>
                </div>
                <div class="mxh">
                    <p>Or login with</p>
                    <div class="fb"><div class="text"><b>f</b></div></div>
                    <div class="sky"><div class="text"><b>S</b></div></div>
                    <div class="google"><div class="text"><b>G</b></div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
